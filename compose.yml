services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: easy_english
      POSTGRES_USER: easy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - easy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easy -d easy_english']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  easy_pg:
