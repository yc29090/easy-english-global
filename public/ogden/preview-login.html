<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简单英语2.0 · 隔离测试登录</title><link rel="stylesheet" href="/ogden/styles.css"><script type="module" src="/ogden/preview-login.js"></script></head><body><main><h1>2.0隔离测试</h1><p>只使用虚构测试账号，数据不进入生产环境，重启预览后清空。不要输入真实邮箱、真实密码或支付信息。</p><form id="preview-login"><label>测试邮箱<input type="email" id="email" autocomplete="off" required></label><label>测试密码<input type="password" id="password" autocomplete="off" required minlength="8"></label><div class="actions"><button type="submit" id="register">创建测试账号并进入</button><button type="button" id="login">登录当前预览已有测试账号</button></div></form><div class="actions"><button type="button" id="logout">退出当前测试账号</button><button type="button" id="new-account">生成另一组测试账号</button></div><p id="feedback" role="status"></p><a href="/ogden">已登录，进入测试教材</a></main></body></html>
