name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: easy
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: easy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easy -d easy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run content:validate
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgres://easy:ci-only-password@localhost:5432/easy_test
      - name: Test embedded PostgreSQL engine
        run: node --test tests/integration.test.ts tests/curriculum-db.test.ts tests/http.test.ts
