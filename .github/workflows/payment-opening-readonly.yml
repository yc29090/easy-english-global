name: Manual payment opening check
on:
  push:
    branches: ['ops/payment-open-check-20261114']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify actual payment flag and original QR images
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const base='https://easy-english-global.onrender.com';
          async function get(path){const r=await fetch(base+path,{redirect:'error',signal:AbortSignal.timeout(60000)});assert.equal(r.status,200);return r;}
          assert.equal((await(await get('/health')).json()).ok,true);
          const catalog=await(await get('/api/catalog')).json();
          assert.equal(catalog.features.manualPayment,true);assert.equal(catalog.features.mockCheckout,false);
          for(const [method,expected] of [['wechat','b8050f1b8583f684ee9a0e0d1ded5b9be6f154b1d7ecb2a89e207f14b665ab4f'],['alipay','a8c6c844a66afdd8d60283fe74bbdc1b870f0c364d4da4351c5dd33fe0501a06']]){
            const image=await get('/payments/'+method+'.jpg');
            assert.equal(createHash('sha256').update(Buffer.from(await image.arrayBuffer())).digest('hex'),expected);
          }
          console.log('MANUAL_PAYMENT_OPEN_VERIFIED: health=ok; manual=true; mock=false; both original QR hashes matched; no production writes; Gmail delivery not tested');
          NODE
