name: Navigation readonly deployment check
on:
  push:
    branches: ['ops/nav-counts-live-643552a']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm live navigation assets and health
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const base='https://easy-english-global.onrender.com',sha='643552ab41a20b07954623b361d8e2c5058fc07a';
          const get=async url=>{const r=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(60000)});assert.equal(r.status,200);return r;};
          assert.equal((await(await get(base+'/health')).json()).ok,true);
          for(const file of ['app.js','styles.css']){
            const live=await(await get(base+'/ogden/'+file+'?nav_release='+sha)).text();
            const source=await(await get('https://raw.githubusercontent.com/yc29090/easy-english-global/'+sha+'/public/ogden/'+file)).text();
            const hash=s=>createHash('sha256').update(s).digest('hex');
            assert.equal(hash(live),hash(source));
            assert.ok(live.includes('nav-count'));
          }
          console.log('LIVE_NAVIGATION_ASSETS_OK '+sha+'; health ok; production writes=0; screenshots=0');
          NODE
