name: Live site acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-acceptance.yml'
      - 'scripts/live-acceptance.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the actual public HTTPS website
        run: npm run smoke -- https://easy-english-global.onrender.com
      - name: Exercise dedicated QA accounts and trial lifecycle
        run: node scripts/live-acceptance.ts
        env:
          LIVE_BASE_URL: https://easy-english-global.onrender.com
