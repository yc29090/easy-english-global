name: Learning V2 live acceptance
on:
  push:
    branches: [main]
    paths: ['deployments/learning-v2.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check real HTTPS homepage, health, content and security
        run: npm run smoke -- https://easy-english-global.onrender.com
      - name: Verify real deployed V2 assets and isolated QA learning flows
        run: node scripts/learning-v2-live.ts
        env:
          V2_LIVE_ACCEPTANCE: enabled
