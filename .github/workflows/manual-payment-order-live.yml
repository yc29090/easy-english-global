name: Manual payment order acceptance
on:
  push:
    branches: [main]
    paths: ['deployments/manual-payment-order-acceptance.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fixed price, claim, ownership and administrator boundary using only a dedicated QA account
        run: node scripts/manual-payment-order-live.ts
        env:
          RUN_MANUAL_PAYMENT_ORDER_ACCEPTANCE: 'yes'
