name: PR11 controlled read-only production smoke
on:
  push:
    branches: [ops/pr11-controlled-smoke]
    paths: ['deployments/pr11-smoke-request.json', 'scripts/pr11-readonly-smoke.mjs', '.github/workflows/pr11-readonly-smoke.yml']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: GET-only live baseline or post-deployment verification
        run: node scripts/pr11-readonly-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr11-readonly-production-evidence
          path: artifacts/pr11-readonly/
